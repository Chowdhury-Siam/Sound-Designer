name: Signed Installer Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-info:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, '🚀 RELEASE v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "$tag" ]]; then
            echo "Tag ${{ github.ref_name }} does not match package version $tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: release-info
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Restore publisher certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.SOUNDDESIGNER_ZXP_CERT_BASE64 }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) { throw "SOUNDDESIGNER_ZXP_CERT_BASE64 is not configured." }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sounddesigner-publisher.p12", [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
      - name: Build signed extension and Windows installer
        env:
          SOUNDDESIGNER_RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          SOUNDDESIGNER_ZXP_CERT: ${{ runner.temp }}\sounddesigner-publisher.p12
          SOUNDDESIGNER_ZXP_PASSWORD: ${{ secrets.SOUNDDESIGNER_ZXP_PASSWORD }}
        run: bun run release:package && bun run installer:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/SoundDesigner-*.zxp
            release/SoundDesigner-*.zxp.sha256
            release/SoundDesigner-*-Windows-Setup.exe
            release/SoundDesigner-*-Windows-Setup.exe.sha256

  macos-installer:
    needs: windows-installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Build branded macOS DMG from signed extension
        run: node scripts/build-macos-installer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/SoundDesigner-*-macOS.dmg
            release/SoundDesigner-*-macOS.dmg.sha256

  publish-release:
    needs: [release-info, windows-installer, macos-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Prepare release notes
        shell: bash
        run: |
          printf '%s\n\n' '![SoundDesigner](https://raw.githubusercontent.com/iboyshanto/SoundDesigner/main/.github/assets/SoundDesigner.png)' > release-body.md
          cat ".github/releases/${{ needs.release-info.outputs.tag }}.md" >> release-body.md
      - name: Prepare GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SoundDesigner ${{ needs.release-info.outputs.tag }}
          tag_name: ${{ needs.release-info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          body_path: release-body.md
          files: |
            release-artifacts/*.zxp
            release-artifacts/*-Windows-Setup.exe
            release-artifacts/*-macOS.dmg
            .github/assets/SoundDesigner.png
